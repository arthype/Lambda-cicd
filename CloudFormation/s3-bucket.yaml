AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Bucket for my test CICD project'

Parameters:
  Environment:
    Type: String
    Default: test
    AllowedValues:
      - test
      - staging
      - production

Resources:
  MyS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub '${AWS::StackName}-${Environment}-bucket'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: GitHubActionsTesting

Outputs:
  MyS3BucketName:
    Description: 'The name of the S3 bucket'
    Value: !Ref MyS3Bucket